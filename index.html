<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цени · Price board</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#EAF2F8;--card:#fff;--ink:#0E2436;--mute:#50687B;--line:#CCDDE9;--blue:#05588F;--accent:#3DB6E0;--tag:#C4E9F8;--tagfg:#06395C;--btnbg:#05588F;--btnfg:#fff;--warn:#A87400;--up:#B83A2E;--down:#1B7A4E;--lowbg:#DDF1E8}
@media(prefers-color-scheme:dark){:root{--bg:#0B1B29;--card:#12293B;--ink:#E4F0F8;--mute:#8FAEC4;--line:#24435A;--blue:#6BC8EE;--accent:#4FBBE6;--tag:#1F5C7E;--tagfg:#EAF7FD;--btnbg:#3FA9D6;--btnfg:#06202F;--warn:#E0B13C;--up:#FF8F80;--down:#62D3A0;--lowbg:#143D33}}
body{border-top:4px solid var(--accent)}
*{box-sizing:border-box}:root{color-scheme:light dark}select option{background:var(--card);color:var(--ink)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font:700 36px "Barlow Condensed",sans-serif;margin:0;color:var(--blue)}.sub{color:var(--mute);margin:2px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--btnbg);color:var(--btnfg);font:500 15px "IBM Plex Sans",sans-serif;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}
input[type=search],select{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input[type=search]{flex:1;min-width:220px}label{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--mute)}
.stats{display:flex;gap:20px;margin:0 0 16px;color:var(--mute)}.stats b{color:var(--ink);font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pn{font-weight:500;font-size:16px}.pm{color:var(--mute);font-size:13px}
.from{font:700 24px "Barlow Condensed",sans-serif;white-space:nowrap}.from span{font:400 13px "IBM Plex Sans",sans-serif;color:var(--mute);margin-right:4px}
.cr{display:grid;grid-template-columns:1fr 100px 130px;gap:4px 12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer}
.cr:first-of-type{border-top:0}.cr:hover,.cr:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.cn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500}
.pr{font:700 24px "Barlow Condensed",sans-serif;text-align:right;line-height:1}.pr s{display:block;font:400 12px "IBM Plex Sans";color:var(--mute)}
.chg{text-align:right;font-size:14px;font-weight:500}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.pill{font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px}.low{background:var(--lowbg);color:var(--down)}.promo{background:var(--tag);color:var(--tagfg)}
.hist{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px}.hist svg{width:100%;height:90px}
.empty,.more{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--mute)}
.ms{position:relative}.ms summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;white-space:nowrap}
.ms summary::-webkit-details-marker{display:none}.ms summary::after{content:"▾";color:var(--mute)}.ms[open] summary{outline:2px solid var(--blue)}
.panel{position:absolute;z-index:5;top:48px;left:0;min-width:230px;max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.panel label{min-height:36px;padding:0 8px;border-radius:6px;color:var(--ink)}.panel label:hover{background:var(--bg)}
.clr{width:100%;min-height:36px;border:0;background:none;color:var(--blue);text-align:left;padding:0 8px;cursor:pointer;font:inherit}
[hidden]{display:none!important}
.hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.logobox{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px}.logobox img{display:block;height:64px;width:auto}
@media(max-width:560px){.logobox img{height:48px}}
.tabs{display:flex;gap:6px;margin:18px 0 0}.tabs button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px 8px 0 0;background:var(--card);color:var(--mute);font:500 15px "IBM Plex Sans",sans-serif;cursor:pointer}.tabs .on{color:var(--ink);border-bottom-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}.kpi span{display:block;color:var(--mute);font-size:13px}.kpi b{font:700 32px "Barlow Condensed",sans-serif}
.hi{color:var(--up)}.lo{color:var(--down)}.md{color:var(--warn)}
.ptr{display:grid;grid-template-columns:120px 100px 100px 1fr 64px;gap:12px;align-items:center;padding:9px 18px;border-top:1px solid var(--line)}.pth{color:var(--mute);font-size:12px;text-transform:uppercase;border-top:0}
.pv{font:700 22px "Barlow Condensed",sans-serif;text-align:right}.ptr .idx{font:700 24px "Barlow Condensed",sans-serif;text-align:right}
.pbar{position:relative;height:14px;background:var(--bg);border-radius:7px}.pbar:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mute)}.pbar b{position:absolute;top:0;bottom:0;border-radius:7px}.pbar .r{left:50%}.pbar .l{right:50%}.pbar .hi{background:var(--up)}.pbar .lo{background:var(--down)}.pbar .md{background:var(--warn)}
.pcard h2{margin:0;padding:14px 18px;font-size:16px;font-weight:500;border-bottom:1px solid var(--line)}.pcard h2 small{color:var(--mute);font-weight:400;margin-left:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two .card{margin:0}
.brw{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;padding:8px 18px}.brt{height:12px;background:var(--bg);border-radius:6px}.brt b{display:block;height:100%;border-radius:6px;background:var(--blue)}.brt .c{background:var(--mute)}.brw em{font:700 20px "Barlow Condensed",sans-serif;text-align:right;font-style:normal}
.pnote{color:var(--mute);font-size:13px;margin:12px 0}details.card summary{padding:12px 18px;cursor:pointer}details.card p{margin:0;padding:6px 18px;font-size:13px}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.ptr{grid-template-columns:90px 1fr 56px}.ptr>:nth-child(2),.ptr>:nth-child(3){display:none}}
.sl{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.sl small{color:var(--mute)}.sl select{border:0;background:transparent;min-height:40px;padding:0 8px}
.cseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.cseg button{min-height:42px;padding:0 14px;border:0;background:var(--card);color:var(--mute);cursor:pointer;font:inherit}.cseg .on{background:var(--tag);color:var(--tagfg)}
.cqs{overflow-x:auto}.cq{display:grid;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}.cqh{border-top:0;color:var(--mute);font-size:12px;text-transform:uppercase}.cqme{background:color-mix(in srgb,var(--blue) 10%,var(--card));border-top:0}
.cqn{font-weight:500}.cqn em{font-style:normal;font-size:11px;background:var(--btnbg);color:var(--btnfg);border-radius:99px;padding:2px 7px;margin-right:6px}
.cqc{text-align:center}.cqc b{display:block;font:700 22px "Barlow Condensed",sans-serif;line-height:1.1}.cqc small{display:block;font-size:11px;color:var(--mute)}
.cq-ok b,.cq-ok small{color:var(--down)}.cq-bad b,.cq-bad small{color:var(--up)}.cq-mid b,.cq-mid small{color:var(--warn)}.cq-na{color:var(--mute)}
.leg{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
@media(max-width:560px){.cr{grid-template-columns:1fr 100px}.chg{display:none}}
</style></head><body><main>
<div class="top"><div class="hd"><span class="logobox"><img src="logo.png" alt="Lactalis MKD" width="173" height="64"></span><div><h1>Цени · Price board</h1><p class="sub" id="upd">Loading…</p></div></div>
<button class="btn" id="exp" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Export to Excel</button></div>
<nav class="tabs"><button type="button" data-tab="board" class="on">Цени по производ</button><button type="button" data-tab="pos">Ценовно позиционирање</button><button type="button" data-tab="cmp">Цена за цена</button></nav>
<div id="board"><div class="bar"><input type="search" id="q" aria-label="Search a product" placeholder="Search a product"><details class="ms" id="chain"><summary>All chains</summary><div class="panel"></div></details><details class="ms" id="cat"><summary>All categories</summary><div class="panel"></div></details><details class="ms" id="brand"><summary>All brands</summary><div class="panel"></div></details>
<label><input type="checkbox" id="promo"> On promotion only</label></div>
<div class="stats" id="stats"></div><div id="list"></div></div><div id="pos" hidden></div><div id="cmp" hidden></div></main>
<script>
const $=id=>document.getElementById(id),MAX=150;let G=[],V=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"–":Math.round(n*100)/100;
function last(it){const h=it.h,l=h[h.length-1],p=h[h.length-2];const d=p&&l[1]!=null&&p[1]!=null?l[1]-p[1]:null;
return{price:l[1],reg:l[2],promo:l[3],date:l[0],d,pct:d!=null&&p[1]?d/p[1]*100:null}}
function spark(h){const v=h.filter(x=>x[1]!=null);if(v.length<2)return'<span style="color:var(--mute)">History appears after two days of data.</span>';
const W=600,H=90,mn=Math.min(...v.map(x=>x[1])),mx=Math.max(...v.map(x=>x[1])),r=mx-mn||1;
const pts=v.map((x,i)=>[i/(v.length-1)*(W-20)+10,H-14-(x[1]-mn)/r*(H-28)]);
return`<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/><text x="10" y="12" font-size="11" fill="var(--mute)">${fmt(mx)} max · ${v[0][0]}</text><text x="${W-10}" y="${H-2}" font-size="11" text-anchor="end" fill="var(--mute)">${fmt(mn)} min · ${v[v.length-1][0]}</text></svg>`}
const sel=id=>[...document.querySelectorAll("#"+id+" input:checked")].map(i=>i.value),ALL={};
function lbl(id){const s=sel(id);$(id).querySelector("summary").textContent=!s.length?ALL[id]:s.length===1?s[0]:s.length+" selected"}
function ms(id,all,vals){ALL[id]=all;$(id).querySelector(".panel").innerHTML='<button type="button" class="clr">Clear selection</button>'+[...new Set(vals)].sort().map(v=>`<label><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label>`).join("");lbl(id)}
function view(){const q=$("q").value.toLowerCase(),c=sel("chain"),k=sel("cat"),b=sel("brand"),po=$("promo").checked;
return G.filter(g=>(!k.length||k.includes(g.category))&&(!b.length||b.includes(g.brand))&&(g.name+" "+g.brand).toLowerCase().includes(q)).map(g=>({...g,rows:g.items.filter(it=>!c.length||c.includes(it.chain)).map(it=>({it,...last(it)})).filter(r=>r.price!=null&&(!po||r.promo)).sort((a,b)=>a.price-b.price)})).filter(g=>g.rows.length)}
function render(){V=view();const n=V.reduce((a,g)=>a+g.rows.length,0),pr=V.reduce((a,g)=>a+g.rows.filter(r=>r.promo).length,0);
$("stats").innerHTML=`<span><b>${V.length}</b> products</span><span><b>${n}</b> prices</span><span><b>${pr}</b> on promotion</span>`;
if(!V.length){$("list").innerHTML='<div class="empty">No products to show. Run the daily scrape, or change the filters.</div>';return}
$("list").innerHTML=V.slice(0,MAX).map((g,gi)=>{const lo=g.rows[0].price;
return`<section class="card"><div class="ch"><div><div class="pn">${esc(g.name)}</div><div class="pm">${g.brand?esc(g.brand)+" · ":""}${esc(g.category)} · ${g.rows.length} chain${g.rows.length>1?"s":""}</div></div><div class="from"><span>from</span>${fmt(lo)} ден</div></div>`+
g.rows.map((r,ri)=>{const cls=r.d>0?"up":r.d<0?"down":"flat";
return`<div class="cr" tabindex="0" data-g="${gi}" data-r="${ri}"><div class="cn">${esc(r.it.chain)}${g.rows.length>1&&r.price===lo?'<span class="pill low">Lowest</span>':""}${r.promo?'<span class="pill promo">Promotion</span>':""}</div>`+
`<div class="chg ${cls}">${r.d==null?"new":(r.d>0?"+":"")+fmt(r.d)}</div><div class="pr">${fmt(r.price)} ден${r.promo&&r.reg?`<s>${fmt(r.reg)} regular</s>`:""}</div></div>`}).join("")+`</section>`}).join("")+
(V.length>MAX?`<div class="more">Showing ${MAX} of ${V.length} products. Use search or filters to narrow down. Export includes all ${V.length}.</div>`:"")}
$("list").addEventListener("click",e=>{const r=e.target.closest(".cr");if(!r)return;const o=r.querySelector(".hist");if(o)return o.remove();
r.insertAdjacentHTML("beforeend",`<div class="hist">${spark(V[r.dataset.g].rows[r.dataset.r].it.h)}</div>`)});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.click()});
$("exp").addEventListener("click",()=>{if(tab==="pos")return exportPos();if(tab==="cmp")return exportCmp();if(!V.length)return alert("Nothing to export.");
const rows=V.flatMap(g=>g.rows.map(r=>({Product:g.name,Brand:g.brand,Category:g.category,Chain:r.it.chain,"Price (ден)":r.price,"Regular price (ден)":r.reg,Promotion:r.promo?"Yes":"No","Change vs previous day (ден)":r.d,"Change (%)":r.pct==null?null:Math.round(r.pct*10)/10,"Price date":r.date})));
const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=[{wch:46},{wch:16},{wch:20},{wch:12},{wch:12},{wch:16},{wch:10},{wch:18},{wch:10},{wch:12}];
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Prices");XLSX.writeFile(wb,"price-board-"+new Date().toISOString().slice(0,10)+".xlsx")});
/*POS-START*/
const OWN=["Alpsko","Dukat","Ideal Sipka","President"],COMP=["Bimilk","Bucen Kozjak","Joka","Meggle","Osogovo","Vemilk","Zbregov","Zdravje Radovo"];
const TR={а:"a",б:"b",в:"v",г:"g",д:"d",ѓ:"g",е:"e",ж:"z",з:"z",ѕ:"z",и:"i",ј:"j",к:"k",л:"l",љ:"l",м:"m",н:"n",њ:"n",о:"o",п:"p",р:"r",с:"s",т:"t",ќ:"k",у:"u",ф:"f",х:"h",ц:"c",ч:"c",џ:"d",ш:"s",š:"s",č:"c",ž:"z",ć:"c",đ:"d"};
const nz=s=>[...String(s||"").toLowerCase()].map(c=>TR[c]??c).join("").replace(/[^a-z0-9]/g,"");
const KEYS=[...OWN.map(b=>[b,nz(b),"own"]),...COMP.map(b=>[b,nz(b),"comp"])];
function brandOf(it){const nb=nz(it.brand),nn=nz(it.name);for(const[b,k,s]of KEYS)if(nb&&(nb.includes(k)||(nb.length>=4&&k.includes(nb))))return{b,s};if(nb)return null;for(const[b,k,s]of KEYS)if(nn.includes(k))return{b,s};return null}
let RAW=[],PREP=null,tab="board",POSCAT="";
function prep(){if(PREP)return PREP;PREP=RAW.map(it=>{const m=brandOf(it),l=last(it);return{it,m,price:l.price,ppu:it.size&&l.price!=null?l.price/it.size:null,gk:it.size?it.kind+"|"+it.size.toFixed(3):null,direct:it.store!=="цена по синџир"}}).filter(x=>x.m&&x.price!=null);return PREP}
const med=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function computePos(cat){const P=prep().filter(x=>x.it.category===cat),dch=new Set(P.filter(x=>x.direct).map(x=>nz(x.it.chain))),S=P.filter(x=>x.ppu!=null&&(x.direct||!dch.has(nz(x.it.chain)))),ch={},km={};let num=0,den=0;
["l","kg"].forEach(k=>{const v=S.filter(x=>x.it.kind===k).map(x=>x.ppu);if(v.length)km[k]=med(v)});
const ok=x=>x.ppu>=km[x.it.kind]/4&&x.ppu<=km[x.it.kind]*4,G=S.filter(ok),odd=S.filter(x=>!ok(x));
G.forEach(x=>{const c=ch[x.it.chain]??={};const g=c[x.gk]??={o:[],c:[]};g[x.m.s==="own"?"o":"c"].push(x.ppu)});
const rows=Object.entries(ch).map(([name,c])=>{let on=0,od=0,o=[],k=[],n=0;
Object.values(c).forEach(g=>{if(g.o.length&&g.c.length){on+=g.o.length*med(g.o)/med(g.c);od+=g.o.length;o.push(...g.o);k.push(...g.c);n+=g.o.length+g.c.length}});
if(!od)return null;num+=on;den+=od;return{name,own:med(o),comp:med(k),idx:on/od*100,n}}).filter(Boolean).sort((a,b)=>b.idx-a.idx);
const br={};G.forEach(x=>(br[x.m.b]??=[]).push(x.ppu));
return{rows,odd,used:G,overall:den?num/den*100:null,br,unsized:P.filter(x=>x.ppu==null),found:P.reduce((a,x)=>(a[x.m.b]=(a[x.m.b]||0)+1,a),{}),count:rows.reduce((a,r)=>a+r.n,0)}}
/*POS-END*/
const cls=i=>i>=110?"hi":i<100?"lo":"md";
function renderPos(){const P=prep(),el=$("pos"),own=c=>P.filter(x=>x.m.s==="own"&&x.it.category===c).length,cats=[...new Set(P.filter(x=>x.m.s==="own").map(x=>x.it.category))];
if(!cats.length){el.innerHTML='<div class="empty">Не се пронајдени производи од вашите брендови ('+esc(OWN.join(", "))+'). Провери како е напишан брендот во податоците или додади го во листата OWN во index.html.</div>';return}
if(!cats.includes(POSCAT))POSCAT=cats.sort((a,b)=>own(b)-own(a))[0];
const R=computePos(POSCAT);
const bars=(L,c)=>L.map(b=>R.br[b]?`<div class="brw"><span>${esc(b)}</span><div class="brt"><b class="${c}" style="width:${Math.round(med(R.br[b])/Math.max(...Object.values(R.br).map(med))*100)}%"></b></div><em>${fmt(med(R.br[b]))}</em></div>`:`<div class="brw"><span>${esc(b)}</span><div class="brt"></div><em>–</em></div>`).join("");
el.innerHTML=`<div class="bar"><select id="pcat" aria-label="Категорија">${cats.sort().map(c=>`<option${c===POSCAT?" selected":""}>${esc(c)}</option>`).join("")}</select></div>
<div class="kpis"><div class="kpi"><span>Ценовен индекс (конкуренција = 100)</span><b class="${R.overall==null?"":cls(R.overall)}">${R.overall==null?"–":Math.round(R.overall)}</b></div><div class="kpi"><span>Синџири каде сме 10%+ поскапи</span><b class="hi">${R.rows.filter(r=>r.idx>=110).length} од ${R.rows.length}</b></div><div class="kpi"><span>Синџири каде сме поефтини</span><b class="lo">${R.rows.filter(r=>r.idx<100).length} од ${R.rows.length}</b></div><div class="kpi"><span>Споредени производи</span><b>${R.count}</b></div></div>
<section class="card pcard"><h2>По синџир<small>просечна цена по л/кг, ден · индекс = наша ÷ конкуренција × 100</small></h2>
<div class="ptr pth"><div>Синџир</div><div style="text-align:right">Наши</div><div style="text-align:right">Конкуренција</div><div>Позиција (средина = еднакви цени)</div><div style="text-align:right">Индекс</div></div>
${R.rows.length?R.rows.map(r=>`<div class="ptr"><b>${esc(r.name)}</b><div class="pv">${fmt(r.own)}</div><div class="pv">${fmt(r.comp)}</div><div class="pbar"><b class="${cls(r.idx)} ${r.idx>=100?"r":"l"}" style="width:${Math.min(Math.abs(r.idx-100)*1.5,50)}%"></b></div><div class="idx ${cls(r.idx)}">${Math.round(r.idx)}</div></div>`).join(""):'<div class="ptr"><span class="pnote">Нема синџир со наши и конкурентски производи со иста големина на пакување во оваа категорија.</span></div>'}</section>
<div class="two" style="margin-top:16px"><section class="card pcard"><h2>Нашите брендови<small>просек ден по л/кг</small></h2>${bars(OWN,"")}</section><section class="card pcard"><h2>Брендови на конкуренцијата<small>просек ден по л/кг</small></h2>${bars(COMP,"c")}</section></div>
<p class="pnote">Се споредува само кога истата категорија и големина на пакување се на полица во ист синџир. Каде има податоци директно од синџирот (референтна продавница), се користат тие, инаку цената по синџир од Пазарлук. Пронајдени производи по бренд: ${Object.entries(R.found).map(([b,n])=>esc(b)+" "+n).join(", ")||"нема"}.</p>
<details class="card"><summary>Сомнителна големина или цена (${R.odd.length}) – исклучени од индексот</summary>${R.odd.slice(0,60).map(x=>`<p>${esc(x.m.b)} · ${esc(x.it.name)} · ${esc(x.it.chain)} · ${fmt(x.price)} ден · прочитано ${x.it.size} ${x.it.kind==="l"?"л":"кг"} → ${fmt(x.ppu)} ден по ${x.it.kind==="l"?"л":"кг"}</p>`).join("")||"<p>Нема.</p>"}</details>
<details class="card"><summary>Споредени производи – за проверка (${R.used.length})</summary>${R.used.slice().sort((a,b)=>a.m.b.localeCompare(b.m.b)).slice(0,200).map(x=>`<p>${x.m.s==="own"?"НАШ":"конк."} · ${esc(x.m.b)} · ${esc(x.it.name)} · ${esc(x.it.chain)} · ${x.it.size} ${x.it.kind==="l"?"л":"кг"} · ${fmt(x.ppu)} ден по ${x.it.kind==="l"?"л":"кг"}</p>`).join("")}</details>
<details class="card"><summary>Производи без прочитана големина (${R.unsized.length}) – не се вклучени во индексот</summary>${R.unsized.slice(0,60).map(x=>`<p>${esc(x.m.b)} · ${esc(x.it.name)} · ${esc(x.it.chain)} · ${fmt(x.price)} ден</p>`).join("")||"<p>Нема.</p>"}</details>`}
function exportPos(){if(!PREP||!POSCAT)return alert("Нема податоци за извоз.");const R=computePos(POSCAT);
const a=XLSX.utils.json_to_sheet(R.rows.map(r=>({"Синџир":r.name,"Наши (ден по л/кг)":Math.round(r.own*100)/100,"Конкуренција (ден по л/кг)":Math.round(r.comp*100)/100,"Индекс":Math.round(r.idx),"Споредени производи":r.n}))),
b=XLSX.utils.json_to_sheet(R.unsized.map(x=>({"Бренд":x.m.b,"Производ":x.it.name,"Синџир":x.it.chain,"Категорија":x.it.category,"Цена (ден)":x.price})));
a["!cols"]=[{wch:14},{wch:20},{wch:24},{wch:8},{wch:20}];b["!cols"]=[{wch:14},{wch:50},{wch:12},{wch:20},{wch:12}];
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,a,"Индекс по синџир");XLSX.utils.book_append_sheet(wb,b,"Без големина");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R.used.map(x=>({"Тип":x.m.s==="own"?"наш":"конкуренција","Бренд":x.m.b,"Производ":x.it.name,"Синџир":x.it.chain,"Големина":x.it.size,"Мерка":x.it.kind==="l"?"л":"кг","Цена (ден)":x.price,"Ден по л/кг":Math.round(x.ppu*100)/100}))),"Споредени");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R.odd.map(x=>({"Бренд":x.m.b,"Производ":x.it.name,"Синџир":x.it.chain,"Големина":x.it.size,"Ден по л/кг":Math.round(x.ppu*100)/100}))),"Сомнителни");XLSX.writeFile(wb,"cenovno-pozicionirane-"+new Date().toISOString().slice(0,10)+".xlsx")}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("board").hidden=tab!=="board";$("pos").hidden=tab!=="pos";$("cmp").hidden=tab!=="cmp";if(tab==="pos")renderPos();if(tab==="cmp")renderCmp()}));
$("pos").addEventListener("change",e=>{if(e.target.id==="pcat"){POSCAT=e.target.value;renderPos()}});
/*CMP-START*/
const szLabel=(k,z)=>k==="l"?(z<1?Math.round(z*1000)+" мл":+z.toFixed(3)+" л"):(z<1?Math.round(z*1000)+" г":+z.toFixed(3)+" кг");
const okey=x=>x.m.b+"|"+(x.it.fat??"")+"|"+x.gk;
function cmpItems(cat){const PC=prep().filter(x=>x.it.category===cat),d=new Set(PC.filter(x=>x.direct).map(x=>nz(x.it.chain)));return PC.filter(x=>x.direct||!d.has(nz(x.it.chain)))}
function cmpData(cat,sz,pk,sameFat){
const U=cmpItems(cat).filter(x=>x.gk===sz),own=U.filter(x=>x.m.s==="own"&&okey(x)===pk);if(!own.length)return null;
const fat=own[0].it.fat??null,byChain={};own.forEach(x=>{const c=nz(x.it.chain);(byChain[c]??={name:x.it.chain,v:[]}).v.push(x.price)});
const chains=Object.entries(byChain).map(([k,o])=>({k,name:o.name,own:med(o.v)})).sort((a,b)=>a.name.localeCompare(b.name));
const fatOn=sameFat&&fat!=null,rows={};let nofat=0;
U.filter(x=>x.m.s==="comp").forEach(x=>{if(fatOn&&x.it.fat!==fat){if(x.it.fat==null)nofat++;return}
const key=x.m.b+(fatOn?"":"|"+(x.it.fat??""));const r=rows[key]??={brand:x.m.b,fat:fatOn?fat:(x.it.fat??null),p:{}};(r.p[nz(x.it.chain)]??=[]).push(x.price)});
COMP.forEach(b=>{if(!Object.values(rows).some(r=>r.brand===b))rows[b+"|none"]={brand:b,fat:fatOn?fat:null,p:{}}});
const list=Object.values(rows).map(r=>{const cells=chains.map(c=>{const v=r.p[c.k];if(!v)return null;const p=med(v),d=p-c.own;return{p,d,pct:d/c.own*100}}),got=cells.filter(Boolean);
return{...r,cells,avg:got.length?got.reduce((a,c)=>a+c.pct,0)/got.length:null}}).sort((a,b)=>(a.avg==null)-(b.avg==null)||(a.avg??0)-(b.avg??0)||a.brand.localeCompare(b.brand));
return{fat,chains,rows:list,nofat}}
/*CMP-END*/
let CC="",CS="",CP="",CF=true,CM="den";
const sg=v=>(v>0.4?"+":v<-0.4?"−":"")+Math.abs(Math.round(v)),clx=d=>d>0?"ok":d<-3?"bad":"mid";
function renderCmp(){const P=prep().filter(x=>x.m.s==="own"&&x.gk),el=$("cmp"),cnt=f=>P.filter(f).length;
const cats=[...new Set(P.map(x=>x.it.category))].sort();
if(!cats.length){el.innerHTML='<div class="empty">Не се пронајдени ваши производи со прочитана големина на пакување.</div>';return}
if(!cats.includes(CC))CC=cats.slice().sort((a,b)=>cnt(x=>x.it.category===b)-cnt(x=>x.it.category===a))[0];
const O=P.filter(x=>x.it.category===CC),sizes=[...new Set(O.map(x=>x.gk))].sort((a,b)=>+a.split("|")[1]-+b.split("|")[1]);
if(!sizes.includes(CS))CS=sizes.slice().sort((a,b)=>O.filter(x=>x.gk===b).length-O.filter(x=>x.gk===a).length)[0];
const prods=[...new Map(O.filter(x=>x.gk===CS).map(x=>[okey(x),x])).entries()].sort((a,b)=>a[1].m.b.localeCompare(b[1].m.b));
if(!prods.some(p=>p[0]===CP))CP=prods.slice().sort((a,b)=>O.filter(x=>okey(x)===b[0]).length-O.filter(x=>okey(x)===a[0]).length)[0][0];
const D=cmpData(CC,CS,CP,CF),sz=x=>szLabel(x.it.kind,x.it.size),first=O.find(x=>x.gk===CS);
const bar=`<div class="bar"><label class="sl"><small>Категорија</small><select id="ccat">${cats.map(c=>`<option${c===CC?" selected":""}>${esc(c)}</option>`).join("")}</select></label>
<label class="sl"><small>Големина</small><select id="csz">${sizes.map(g=>{const x=O.find(y=>y.gk===g);return`<option value="${g}"${g===CS?" selected":""}>${sz(x)}</option>`}).join("")}</select></label>
<label class="sl"><small>Наш производ</small><select id="cprod">${prods.map(([k,x])=>`<option value="${esc(k)}"${k===CP?" selected":""}>${esc(x.m.b)} · ${x.it.fat!=null?x.it.fat+"%":"без масленост"} · ${sz(x)}</option>`).join("")}</select></label>
<label class="sl"><input type="checkbox" id="cfat"${CF?" checked":""}> Иста масленост${D&&D.fat!=null?" ("+D.fat+"%)":""}</label>
<span class="cseg"><button type="button" data-m="den" class="${CM==="den"?"on":""}">ден</button><button type="button" data-m="pct" class="${CM==="pct"?"on":""}">%</button></span></div>`;
if(!D||!D.chains.length){el.innerHTML=bar+'<div class="empty">Нема цени за овој наш производ.</div>';return}
const n=D.chains.length,cols=`230px repeat(${n},minmax(86px,1fr)) 110px`,mw=230+n*94+130,st=`grid-template-columns:${cols};min-width:${mw}px`,
cell=c=>c?`<div class="cqc cq-${clx(c.d)}"><b>${fmt(c.p)}</b><small>${CM==="den"?sg(c.d)+" ден":sg(c.pct)+"%"}</small></div>`:'<div class="cqc cq-na">–</div>',
w=D.rows.filter(r=>r.avg!=null),ch=w[0],exp=D.chains.filter((c,i)=>{const ps=D.rows.map(r=>r.cells[i]).filter(Boolean);return ps.length&&ps.every(p=>p.d<0)}).length,
own=O.find(x=>okey(x)===CP);
el.innerHTML=bar+`<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span>Најевтин конкурент (просек)</span><b class="${ch&&ch.avg<0?"hi":"lo"}">${ch?esc(ch.brand)+" "+sg(ch.avg)+"%":"–"}</b></div><div class="kpi"><span>Синџири каде сме најскапи</span><b class="${exp?"hi":"lo"}">${exp} од ${n}</b></div><div class="kpi"><span>Конкурентски брендови со податоци</span><b>${w.length} од ${COMP.length}</b></div></div>
<section class="card pcard"><div class="cqs"><div class="cq cqh" style="${st}"><div>Производ</div>${D.chains.map(c=>`<div class="cqc">${esc(c.name)}</div>`).join("")}<div class="cqc">Просечна разлика</div></div>
<div class="cq cqme" style="${st}"><div class="cqn"><em>НАШ</em> ${esc(own.m.b)} · ${szLabel(own.it.kind,own.it.size)}${D.fat!=null?" · "+D.fat+"%":""}</div>${D.chains.map(c=>`<div class="cqc"><b>${fmt(c.own)}</b><small>наша цена</small></div>`).join("")}<div class="cqc">–</div></div>
${D.rows.map(r=>`<div class="cq" style="${st}"><div class="cqn">${esc(r.brand)}${r.fat!=null?" · "+r.fat+"%":""}</div>${r.cells.map(cell).join("")}${r.avg==null?'<div class="cqc cq-na">–</div>':`<div class="cqc cq-${clx(r.avg)}"><b>${sg(r.avg)}%</b></div>`}</div>`).join("")}</div></section>
<div class="leg"><span><i style="background:var(--up)"></i>конкурентот е поевтин од нас (над 3 ден)</span><span><i style="background:var(--warn)"></i>скоро исто</span><span><i style="background:var(--down)"></i>конкурентот е поскап од нас</span></div>
<p class="pnote">Се споредуваат производи од иста категорија, иста големина на пакување${D.fat!=null&&CF?" и иста масленост":""}, во ист синџир. „–“ значи дека производот не е пронајден во тој синџир. Разликата е цената на конкурентот минус нашата цена. Каде има податоци директно од синџирот се користат тие, инаку Пазарлук.${D.nofat?` ${D.nofat} конкурентски производи без прочитана масленост не се вклучени.`:""}</p>`}
function exportCmp(){if(!CP)return alert("Нема податоци за извоз.");const D=cmpData(CC,CS,CP,CF);if(!D)return alert("Нема податоци за извоз.");
const rows=[];D.rows.forEach(r=>r.cells.forEach((c,i)=>{if(c)rows.push({"Синџир":D.chains[i].name,"Конкурентски бренд":r.brand,"Масленост (%)":r.fat,"Наша цена (ден)":Math.round(D.chains[i].own*100)/100,"Цена на конкурент (ден)":Math.round(c.p*100)/100,"Разлика (ден)":Math.round(c.d*100)/100,"Разлика (%)":Math.round(c.pct*10)/10})}));
const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=[{wch:14},{wch:20},{wch:14},{wch:16},{wch:22},{wch:14},{wch:12}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Цена за цена");XLSX.writeFile(wb,"cena-za-cena-"+new Date().toISOString().slice(0,10)+".xlsx")}
$("cmp").addEventListener("change",e=>{const t=e.target.id;if(t==="ccat"){CC=e.target.value;CS="";CP=""}else if(t==="csz"){CS=e.target.value;CP=""}else if(t==="cprod")CP=e.target.value;else if(t==="cfat")CF=e.target.checked;else return;renderCmp()});
$("cmp").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b){CM=b.dataset.m;renderCmp()}});
fetch("data/prices.json").then(r=>r.json()).then(j=>{RAW=j.items;const m=new Map();
j.items.forEach(it=>{const k=it.id||it.name;if(!m.has(k))m.set(k,{name:it.name,category:it.category,brand:"",items:[]});const g=m.get(k);if(!g.brand&&it.brand)g.brand=it.brand;g.items.push(it)});
G=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name));$("upd").textContent=j.updated?"Last scrape: "+j.updated:"No data yet";
const opt=(id,all,vals)=>$(id).innerHTML=`<option value="">${all}</option>`+[...new Set(vals)].sort().map(v=>`<option>${esc(v)}</option>`).join("");
ms("chain","All chains",j.items.map(x=>x.chain));ms("cat","All categories",j.items.map(x=>x.category));ms("brand","All brands",j.items.map(x=>x.brand).filter(Boolean));render()}).catch(()=>$("upd").textContent="Could not load data/prices.json");
["q","promo"].forEach(id=>$(id).addEventListener("input",render));
["chain","cat","brand"].forEach(id=>{const el=$(id);
el.addEventListener("change",e=>{if(e.target.matches("input")){lbl(id);render()}});
el.addEventListener("click",e=>{if(e.target.matches(".clr")){el.querySelectorAll("input").forEach(i=>i.checked=false);lbl(id);render()}})});
document.addEventListener("click",e=>document.querySelectorAll(".ms[open]").forEach(d=>{if(!d.contains(e.target))d.open=false}));
</script></body></html>
